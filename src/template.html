  line-height: 1;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.card-artist { color: var(--paper); font-size: 14px; }
.card-movie {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--marigold);
}
/* Not a film title, so it should not be dressed as one. */
.card-movie.is-single { color: var(--muted); }

.fullplayer {
  display: flex;
  align-items: center;
  gap: var(--step-2);
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--step-2) var(--step-3);
}
.mini-play {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--marigold);
  background: rgba(242,169,59,0.12);
  color: var(--marigold);
  display: grid; place-items: center;
  flex-shrink: 0;
}
.mini-play:hover:not(:disabled) { background: rgba(242,169,59,0.24); }
.mini-play:disabled { opacity: 0.4; border-color: var(--muted-2); color: var(--muted-2); }
.scrub {
  flex: 1;
  height: 4px;
  background: var(--ink-4);
  border-radius: 999px;
  overflow: hidden;
}
.scrub-fill { height: 100%; background: var(--marigold); border-radius: 999px; }
.clock {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

/* ---------- notices ---------- */
.notice {
  border: 1px solid var(--line);
  border-left: 3px solid var(--marigold);
  background: var(--ink-2);
  border-radius: var(--radius);
  padding: var(--step-2) var(--step-3);
  font-size: 13px;
  color: var(--muted);
  line-height: 1.45;
}
.notice b { color: var(--paper); font-weight: 600; }
.notice code {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--marigold);
  background: var(--ink-3);
  border-radius: 4px;
  padding: 1px 5px;
  word-break: break-all;
}

  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
}

.foot {
  margin-top: auto;
  padding-top: var(--step-3);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--muted-2);
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.foot a { color: var(--muted); }

@media (max-width: 420px) {
  .card { flex-direction: column; align-items: flex-start; text-align: left; }

  /* Album art is SQUARE. A full-width box 150px tall is 2.2:1, and object-fit:
     cover crops to fill - so the top and bottom two thirds of every cover were
     being thrown away and what showed was a letterbox slice of the middle.
     Match the source's aspect ratio and the whole image survives.
     The vh cap is what keeps the reveal from growing so tall that "Next song"
     drops below the fold again on a short phone. */
  .cover {
    width: min(100%, 40vh);
    height: auto;
    aspect-ratio: 1;
    align-self: center;
    font-size: 64px;          /* the no-artwork placeholder letter, scaled up */
  }
  .transport { gap: var(--step-2); }
  .transport-meta { min-width: 72px; }

     monospace. On a 390px screen "Guess the Bollywood song" and "this session"
     together overrun the line and the score runs off the right edge. Tracking
     is the cheapest thing to give back - it costs nothing but swagger, and a
     flex item will not shrink below its content without min-width: 0. */
  .masthead { gap: var(--step-2); }

  .scoreline { font-size: 10px; letter-spacing: 0.04em; }
}

   overruns, clip it rather than letting the whole page slide. */
html, body { overflow-x: hidden; }

        // full preview keeps running until something stops it. Stopping the
        // player is not enough: busy has to come down with it, or the new round
        // opens showing a stop button for audio that is not playing.
        setBusy(false);

        trackFor(next).then(function (t) {
          if (token !== roundRef.current) return;    // a newer round superseded us
          // No preview and the network is fine means this one song is a dud:
          // drop it for the session and deal another rather than stranding the
          // player on a round they cannot hear.
          if (!t && !offlineRef.current) {
            deadRef.current[next.uid] = true;
            if (triesLeft > 0) return deal(seen, triesLeft - 1);
            setAudioErr("That preview would not load. Try skipping to the next song.");
            return;
          }
          setTrack(t);
          playerFor(t).load(t || { seed: songSeed(next) });
          setReady(true);
          prefetch(seen.concat([next.uid]));
        });
      }

      deal(currentPlayed || played, 2);
    }, [played]);

    /* ---- room control ---- */

    // A room round has nothing to deal. Its six songs were fixed before the
    // room started and every candidate was resolved in one batch on the way in,
    // so there is no random pick, no prefetch and - deliberately - no reroll on
    // a dud. Swapping a song out here is precisely the bug rooms exist to
    // avoid: it would move this player onto a song nobody else is hearing.
    var startRoomRound = useCallback(function (r, index) {
      var token = ++roundRef.current;
      var next = r.songs[index];
      if (!next) return;

      if (playerRef.current) playerRef.current.stop();
      setSong(next);
      setTrack(null);
      setReady(false);
      setGuesses([]);
      setText("");
      setPos(0);
      setAudioErr("");
      setBusy(false);
      setPhase("play");
      scrollToTop();

      trackFor(next).then(function (t) {
        if (token !== roundRef.current) return;
        setTrack(t);
        playerFor(t).load(t || { seed: songSeed(next) });
        setReady(true);
      });
    }, []);

    var enterRoom = useCallback(function (code) {
      setRoomErr("");
      setCopied("");
      setRoomLoading(true);

      var saved = loadRoomResults(code);
      var candidates = roomCandidates(code, SONGS);

      // Thirty ids is one batched request, which is also what makes the room
      // deterministic: every candidate's playability is known before the first
      // round opens, rather than discovered one round at a time.
      resolveCatalog(candidates).then(function (res) {
        setRoomLoading(false);

        var usable;
        if (res.offline) {
          // Nothing resolves in demo mode, so playability cannot be the filter
          // or the room would be empty. Take the first six and let the synth
          // stand in - everyone offline still gets the same six songs.
          offlineRef.current = true;
          setOffline(true);
          usable = candidates.slice(0, ROOM_ROUNDS);
        } else {
          Object.keys(res.tracks).forEach(function (uid) {
            cacheRef.current[uid] = res.tracks[uid];
          });
          candidates.forEach(function (s) {
            if (!res.tracks[s.uid]) deadRef.current[s.uid] = true;
          });
          usable = candidates.filter(function (s) { return res.tracks[s.uid]; })
                             .slice(0, ROOM_ROUNDS);
        }

        if (usable.length < ROOM_ROUNDS) {
          setRoomErr("Only " + usable.length + " of this room's songs have a playable " +
                     "preview here, so it cannot be filled. Try a new room.");
          writeHashRoom(null);
          return;
        }

        var r = {
          code: code,
          songs: usable,
          index: saved ? saved.length : 0,
          results: saved || [],
        };
        setRoom(r);
        writeHashRoom(code);

        // Reopening a finished link shows what you got. Rolling it again would
        // defeat the point: the result is only worth comparing if everybody had
        // one attempt at the same six songs.
        if (r.results.length >= ROOM_ROUNDS) { setPhase("summary"); scrollToTop(); }
        else startRoomRound(r, r.index);
      });
    }, [startRoomRound]);

    function leaveRoom() {
      setRoom(null);
      setRoomErr("");
      setCopied("");
      writeHashRoom(null);
    }

    // The URL is the only way into a room, so it is read on mount and watched
    // afterwards - a pasted link, the back button and a manually edited hash
    // all arrive through the same door.
    useEffect(function () {
      var code = readHashRoom();
      if (code) enterRoom(code);

      function onHash() {
        var next = readHashRoom();
        if (next) enterRoom(next);
        else { setRoom(null); setPhase("start"); }
      }
      try { window.addEventListener("hashchange", onHash); } catch (e) { return; }
      return function () {
        try { window.removeEventListener("hashchange", onHash); } catch (e) { /* gone */ }
      };
    }, [enterRoom]);

    function playSnippet(span) {
      var p = player();
      if (busy) { p.stop(); setBusy(false); setPos(0); return; }
      setAudioErr("");
      setBusy(true);
      p.play(span, {
        onTick: function (t) { setPos(t); },
        onEnd: function () { setBusy(false); setPos(0); }
      }).catch(function (err) {
        setBusy(false);
        setPos(0);
        // Autoplay policy is not a concern (every play is a click), but a dead
        // CDN or a dropped connection is.
        setAudioErr(err && err.name === "NotAllowedError"
          ? "Your browser blocked playback. Tap play once more."
          : "That preview would not load. Try skipping to the next song.");
      });
    }

    function finish(won, list) {
      setGuesses(list);
      setPhase(won ? "won" : "lost");

      // A room round is scored into the room and nowhere else. The saved score
      // is a running lifetime tally of endless play; a room is a fixed set of
      // six that other people are playing too, and mixing them would make both
      // numbers mean nothing.
      if (room) {
        var results = room.results.concat([{ won: won, attempts: list.length }]);
        setRoom(Object.assign({}, room, { results: results }));
        saveRoomResults(room.code, results);
        player().stop();
        setBusy(false);
        setPos(0);
        return;
      }

      setScore(function (s) {
        var streak = won ? s.streak + 1 : 0;
        var next = {
          won: s.won + (won ? 1 : 0),
          total: s.total + 1,
          streak: streak,
          best: Math.max(s.best, streak),
        };
        // Written here rather than from an effect on [score]: an effect would
        // also fire on mount and write the value straight back, and a round
        // ending is the only moment the score actually changes.
        saveScore(next);
        return next;
      });
      player().stop();
      setBusy(false);
      setPos(0);
    }

    // Back to the start screen from anywhere.
    //
    // Leaving mid-round abandons that round without scoring it: finish() is the
    // only thing that touches the score, and a round the player walked out of is
    // not a loss. That does mean a losing round can be escaped by going home,
    // which is a trade made knowingly - this is a solitaire party game, and
    // punishing someone for tapping the logo would be the worse bug.
    //
    // played is deliberately NOT cleared, so a session that goes home and starts
    // again does not deal songs it has already used.
    function goHome() {
      player().stop();
      leaveRoom();
      setPhase("start");
      scrollToTop();
      setSong(null);
      setTrack(null);
      setReady(false);
      setGuesses([]);
      setText("");
      setBusy(false);
      setPos(0);
      setAudioErr("");
    }

    function submitGuess(picked) {
      if (over || !song) return;
      // Identity, not title. Hindi titles repeat across films (Tere Bina,
      // Zaalima, Bekhayali), and naming a different film's song of the same
      // name is a wrong answer, not a win.
      var right = picked.uid === song.uid;
      var list = guesses.concat([{ type: right ? "correct" : "wrong", title: guessLabel(picked) }]);
      setText("");
      if (right) return finish(true, list);
      if (list.length >= MAX_ATTEMPTS) return finish(false, list);
      setGuesses(list);
      player().stop();
      setBusy(false);
      setPos(0);
    }

    function skip() {
      if (over || !song) return;
      var list = guesses.concat([{ type: "skip" }]);
      setText("");
      if (list.length >= MAX_ATTEMPTS) return finish(false, list);
      setGuesses(list);
      player().stop();
      setBusy(false);
      setPos(0);
    }

    // Ends the round now. Skipping six times to reach a song you already know
    // you cannot name is a chore, not a decision. The rows are left as they
    // are rather than padded out to six, so the reveal shows what was actually
    // tried - which is also what tells the verdict line to say "gave up"
    // instead of "out of guesses".
    function giveUp() {
      if (over || !song) return;
      setText("");
      finish(false, guesses);
    }

    /* ---- derived UI values ---- */

    var headFrac = 0;
    if (busy && pos > 0) {
      headFrac = over
        ? Math.min(1, pos / (player().duration() || 30))
        : Math.min(unlocked, unlocked * (pos / limit));
    }

    var skipLabel = attempt >= MAX_ATTEMPTS - 1
      ? "Give up"
      : "Skip +" + label(STEPS[attempt + 1] - STEPS[attempt]);

    /* ---- screens ---- */

    function Masthead() {
      // On the start screen there is nowhere to go back to, so neither control
      // is rendered - a back button that returns you to the page you are already
      // on is noise, and a logo that looks clickable but is not is worse.
      var atHome = phase === "start";
      return h("header", { className: "masthead" },
        h("div", null,
          atHome ? null : h("button", {
            className: "backbtn",
            onClick: goHome,
          }, "← Home"),
          h("h1", { className: "wordmark" },
            atHome
              ? h(React.Fragment, null, "Fil", h("em", null, "mi"))
              : h("button", {
                  className: "wordmark-btn",
                  onClick: goHome,
                  "aria-label": "Filmi — back to the start screen",
                }, "Fil", h("em", null, "mi"))),
          h("p", { className: "tagline" }, "Guess the Bollywood song")
        ),
        h("div", {
          style: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "7px" }
        },
          offline ? h("span", {
            className: "demochip",
            title: "Apple's previews are unreachable here, so the audio is synthesised"
          }, "Demo audio") : null,
          // In a room the lifetime score is the wrong number to show - the round
          // counter is what the player is actually inside of.
          // Silent on the summary, where the screen's own heading already names
          // the room in type twice this size. Saying it in both places just
          // makes the reader check whether they are two different things.
          // Three short lines rather than one long one: the masthead's other
          // column is wide tracked monospace too, and a single "nazar-sitara ·
          // round 3 of 6 · 11 pts" is what pushes the pair off a narrow phone.
          //
          // The total counts finished rounds only, so it is what you have
          // banked, not what you might still get. It moves when a round ends.
          room && phase !== "summary"
            ? h("div", { className: "scoreline" },
                room.code, h("br"),
                h("b", null, roomPoints(room.results)), " / " + ROOM_MAX_POINTS, h("br"),
                "round " + Math.min(room.results.length + 1, ROOM_ROUNDS) + " of " + ROOM_ROUNDS)
            : null,
          // No longer "this session" - it outlives the tab now.
          !room && score.total > 0
            ? h("div", { className: "scoreline" },
                h("b", null, score.won), " / ", score.total, h("br"),
                "streak " + score.streak + " · best " + score.best)
            : null
        )
      );
    }

    // The <audio> element is mounted once, above the phase switch. If it were
    // rendered inside each screen it would sit at a different position in each
    // tree and React would remount it on every phase change - which drops the
    // src and leaves the player holding a detached node.
    function frame(content) {
      return h(React.Fragment, null,
        h("audio", { ref: audioRef, preload: "auto" }),
        content);
    }

    function Foot() {
      return h("footer", { className: "foot" },
        h("div", null, "Audio previews and artwork supplied by the Apple iTunes Search API."),
        h("div", null, "Not affiliated with Apple. All songs belong to their respective rights holders.")
      );
    }

    if (phase === "start") {
      return frame(h("div", { className: "shell" },
        Masthead(),
        offline ? h("div", { className: "notice" },
          h("b", null, "No real songs here."), " Apple's preview servers are unreachable from this page, so every round runs on generated stand-in audio. The interface is fully playable, but the clips are not the actual recordings. ",
          h("b", null, "To hear the real Hindi songs,"), " open the ", h("code", null, "bollywood-heardle.html"),
          " file straight from your computer — same game, real 30-second previews."
        ) : null,
        audioErr ? h("div", { className: "notice bad" }, audioErr) : null,
        h("div", { className: "start" },
          h("p", { className: "start-lede" },
            "You get half a second of a Hindi film song. Name it. Every miss or skip buys you a little more."),
          h("div", { className: "start-steps" }, STEPS.map(function (s) {
            return h("span", { key: s }, label(s));
          })),
          h("button", {
            className: "btn btn-primary",
            style: { padding: "16px 34px", fontSize: "15px", marginTop: "8px" },
            // played, not [] - coming home mid-session and starting again must
            // not re-deal songs this session has already used.
            onClick: function () { startRound(played); }
          }, "Endless / Random"),

          h("div", { className: "roombox" },
            h("button", {
              className: "btn",
              disabled: roomLoading,
              onClick: function () { enterRoom(newRoomCode()); }
            }, roomLoading ? "Building a room…" : "Start a room"),
            h("p", { className: "roombox-note" },
              "Six songs, fixed by the room's name. Send the link and everyone " +
              "who opens it plays the same six, in the same order.")
          ),

          roomErr ? h("div", { className: "notice bad" }, roomErr) : null,
          h("div", { className: "loading-label" }, SONGS.length + " songs in the catalog"),
          score.total > 0
            ? h("div", { className: "loading-label", style: { marginTop: "10px" } },
                "Saved record " + score.won + " / " + score.total +
                  (score.best > 0 ? " · best streak " + score.best : ""),
                " ",
                h("button", {
                  className: "backbtn",
                  style: { display: "inline", margin: "0 0 0 8px" },
                  onClick: function () {
                    clearScore();
                    setScore(EMPTY_SCORE);
                  }
                }, "Reset"))
            : null
        ),
        Foot()
      ));
    }

    /* ---- room summary: the screen whose whole job is to be pasted elsewhere ---- */
    if (phase === "summary" && room) {
      var roomWon = room.results.filter(function (r) { return r.won; }).length;
      return frame(h("div", { className: "shell" },
        Masthead(),
        h("div", { className: "summary" },
          h("div", { className: "summary-head" },
            h("div", { className: "summary-room" }, room.code),
            h("div", { className: "summary-score" },
              roomPoints(room.results), h("i", null, "/" + ROOM_MAX_POINTS)),
            h("div", { className: "summary-label" },
              "points · " + roomWon + " of " + room.results.length + " named")
          ),

          // The running order, which is what a room actually is. Numbered
          // because it genuinely is a sequence - everyone who opens this link
          // hears these songs in this order - and the number is the only way to
          // say "song 4 got me" to someone else.
          h("ol", { className: "setlist" }, room.results.map(function (r, i) {
            var s = room.songs[i];
            return h("li", { key: i, className: "setlist-row " + (r.won ? "is-won" : "is-lost") },
              h("span", { className: "setlist-n" }, i + 1),
              h("span", { className: "setlist-song" },
                h("b", null, s.title),
                h("em", null, s.isFilm ? s.movie : s.artist)),
              h("span", { className: "setlist-at" },
                r.won ? label(STEPS[r.attempts - 1]) : "missed"),
              // The time says how you did; this says what it was worth. Both,
              // because the point of the change is that the two are connected.
              h("span", { className: "setlist-pts" },
                r.won ? "+" + roundPoints(r) : "0")
            );
          })),

          h("button", {
            className: "btn btn-primary summary-share",
            onClick: function () {
              copyText(roomLink(room.code)).then(function (ok) {
                setCopied(ok ? "link" : "failed");
              });
            }
          }, copied === "link" ? "Link copied" : "Copy link"),

          copied === "failed"
            ? h("div", { className: "notice bad" },
                "This browser blocked the clipboard. Copy the address bar instead — the room is in the URL.")
            : null,

          h("p", { className: "summary-note" },
            "Anyone who opens this link plays these six, in this order. ",
            h("span", { className: "summary-tag" }, CATALOG_TAG),
            " is this build's catalog — a friend on a different tag gets different songs."),

          h("div", { className: "summary-acts" },
            h("button", {
              className: "linkbtn",
              disabled: roomLoading,
              onClick: function () { enterRoom(newRoomCode()); }
            }, roomLoading ? "Building…" : "New room"),
            h("span", { className: "summary-dot" }, "·"),
            h("button", { className: "linkbtn", onClick: goHome }, "Endless mode")
          )
        ),
        Foot()
      ));
    }

    /* ---- reveal ---- */
    if (over) {
      return frame(h("div", { className: "shell" },
        Masthead(),
        h("div", { className: "reveal" },
          h("div", { className: "verdict " + (phase === "won" ? "win" : "lose") },
            phase === "won"
              ? "Correct in " + guesses.length + (guesses.length === 1 ? " guess" : " guesses")
              : guesses.length >= MAX_ATTEMPTS
                ? "Out of guesses — the song was"
                : "Gave up — the song was"),

          h("div", { className: "card" },
            track && track.artwork
              ? h("img", { className: "cover", src: track.artwork, alt: song.title + " cover art" })
              : h("div", {
                  className: "cover",
                  style: {
                    background: "linear-gradient(145deg, hsl(" + (songSeed(song) % 360) + " 42% 26%), var(--ink-4))"
                  }
                }, song.title.slice(0, 1).toUpperCase()),
            h("div", { className: "card-meta" },
              h("h2", { className: "card-title" }, song.title),
              h("div", { className: "card-artist" }, song.artist),
              // Non-film songs have no film line; the artist above already
              // says everything there is to say about where the song is from.
              song.isFilm
                ? h("div", { className: "card-movie" }, song.movie)
                : h("div", { className: "card-movie is-single" }, "Non-film single")
            )
          ),

          h("div", { className: "fullplayer" },
            h("button", {
              className: "mini-play",
              disabled: !ready,
              "aria-label": !ready ? "Loading the preview" : (busy ? "Stop" : "Play the full preview"),
              onClick: function () { playSnippet(null); }
            }, busy ? h(IconStop, { size: 17 }) : h(IconPlay, { size: 17 })),
            h("div", { className: "scrub" },
              h("div", {
                className: "scrub-fill",
                style: { width: (headFrac * 100) + "%" }
              })),
            h("div", { className: "clock" }, fmt(pos) + " / " + fmt(player().duration()))
          ),

          audioErr ? h("div", { className: "notice bad" }, audioErr) : null,

          offline ? h("div", { className: "notice" },
            h("b", null, "You heard stand-in audio, not the song."),
            " Apple's previews are unreachable from here, so the clip was generated."
          ) : null,

          // Directly under the player, above the guess history: moving on is
          // what almost everyone wants next, and it should never be something
          // you have to scroll past your own wrong answers to reach.
          h("button", {
            className: "btn btn-primary btn-next",
            onClick: function () {
              if (!room) return startRound(played);
              var done = room.results.length;
              if (done >= ROOM_ROUNDS) { player().stop(); setBusy(false); setPhase("summary"); scrollToTop(); }
              else startRoomRound(Object.assign({}, room, { index: done }), done);
            }
          }, room
              ? (room.results.length >= ROOM_ROUNDS
                  ? "See your result"
                  : "Next song · " + (room.results.length + 1) + " of " + ROOM_ROUNDS)
              : "Next song"),

          h("div", { className: "rows" }, guesses.map(function (g, i) {
            return h("div", {
              key: i,
              className: "row row-" + g.type
            },
              h("span", { className: "row-text" }, g.type === "skip" ? "Skipped" : g.title),
              h("span", { className: "row-tag" }, label(STEPS[i]))
            );
          }))
        ),
        Foot()
      ));
    }

    /* ---- active round ---- */
    return frame(h("div", { className: "shell" },
      Masthead(),

      h("div", { className: "stage" },
        h(Waveform, { shape: shape, unlocked: unlocked, head: headFrac }),
        h("div", { className: "ticks" }, STEPS.map(function (s, i) {
          var on = i <= attempt;
          var now = i === attempt;
          return h("div", {
            key: s,
            className: "tick" + (on ? " is-on" : "") + (now ? " is-now" : "")
          }, label(s));
        }))
      ),

      h("div", { className: "transport" },
        h("div", { className: "transport-meta", style: { textAlign: "right" } },
          h("b", null, label(limit)), "unlocked"),
        h("button", {
          className: "play" + (!busy && ready ? " is-idle" : ""),
          disabled: !ready,
          "aria-label": !ready
            ? "Loading the preview"
            : (busy ? "Stop playback" : "Play " + label(limit) + " of the song"),
          onClick: function () { playSnippet(limit); }
        }, busy ? h(IconStop, null) : h(IconPlay, null)),
        h("div", { className: "transport-meta" },
          h("b", null, MAX_ATTEMPTS - attempt), "left")
      ),

      audioErr ? h("div", { className: "notice bad" }, audioErr) : null,

      h(Typeahead, {
        songs: SONGS,
        text: text,
        setText: setText,
        disabled: false,
        onSubmit: submitGuess,
        onSkip: skip,
        onGiveUp: giveUp,
        skipLabel: skipLabel
      }),

      // Below the controls, not above them. The waveform, the play button and
      // the guess box are what a round is actually played with; the history of
      // what you already got wrong is reference material, and putting it first
      // pushed the whole playable section down the screen on a phone.
      h("div", { className: "rows" },
        Array.apply(null, Array(MAX_ATTEMPTS)).map(function (_, i) {
          var g = guesses[i];
          if (!g) {
            return h("div", { key: i, className: "row row-empty" },
              h("span", { className: "row-text" }, ""),
              h("span", { className: "row-tag" }, label(STEPS[i])));
          }
          return h("div", { key: i, className: "row row-" + g.type },
            h("span", { className: "row-text" }, g.type === "skip" ? "Skipped" : g.title),
            h("span", { className: "row-tag" }, label(STEPS[i])));
        })
      ),

      Foot()
    ));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
