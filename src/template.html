<style>
/* Anton, inlined as a data URI. The Artifact CSP blocks font CDNs, so a
   linked webfont would silently fall back to a system face. */
@font-face {
  font-family: 'Anton';
  src: url(data:font/woff2;base64,__ANTON_B64__) format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

/* This design commits to a single dark world on purpose - it is a darkened
   cinema hall, not a document. The tokens are pinned so the viewer's theme
   toggle cannot half-invert it into something broken. */
:root, :root[data-theme="dark"], :root[data-theme="light"] {
  --ink:      #0A0910;
  --ink-2:    #15121F;
  --ink-3:    #211D30;
  --ink-4:    #2C2740;
  --line:     #322C48;
  --marigold: #F2A93B;
  --marigold-dim: #7A5620;
  --rose:     #D8456F;
  --jade:     #35C88A;
  --muted:    #8E86A6;
  --muted-2:  #635C7A;
  --paper:    #F4F1EA;

  --step-1: 6px;
  --step-2: 10px;
  --step-3: 16px;
  --step-4: 24px;
  --step-5: 36px;

  --radius: 8px;
  --font-display: 'Anton', 'Haettenschweiler', 'Arial Narrow', sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;

  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  /* two very soft pools of warm light, like a projector bulb */
  /* Deliberately not background-attachment: fixed - it makes the compositor
     repaint the whole page behind the reveal animation and leaves ghost text. */
  background-image:
    radial-gradient(60rem 40rem at 50% -10%, rgba(242,169,59,0.10), transparent 60%),
    radial-gradient(45rem 35rem at 90% 105%, rgba(216,69,111,0.07), transparent 65%);
  background-repeat: no-repeat;
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

#root { min-height: 100vh; }

.shell {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: var(--step-4) var(--step-3) var(--step-4);
  display: flex;
  flex-direction: column;
  gap: var(--step-3);
  min-height: 100vh;
}

/* ---------- masthead ---------- */
.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--step-3);
  border-bottom: 1px solid var(--line);
  padding-bottom: var(--step-2);
}
.wordmark {
  font-family: var(--font-display);
  font-size: clamp(30px, 8vw, 40px);
  letter-spacing: 0.02em;
  line-height: 0.9;
  margin: 0;
  color: var(--paper);
  text-transform: uppercase;
}
.wordmark em {
  font-style: normal;
  color: var(--marigold);
}
.tagline {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin: 4px 0 0;
}
.scoreline {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.scoreline b { color: var(--marigold); font-weight: 600; }

/* Demo-mode badge. This has to stay visible on every screen - if it only shows
   on the start screen, a player who clicks straight through has no idea the
   audio is synthesised rather than the real recording. */
.demochip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--rose);
  border: 1px solid rgba(216,69,111,0.45);
  background: rgba(216,69,111,0.10);
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
}
.demochip::before {
  content: "";
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--rose);
  flex-shrink: 0;
}

/* ---------- generic controls ---------- */
button { font-family: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }

:where(button, input, a, [tabindex]):focus-visible {
  outline: 2px solid var(--marigold);
  outline-offset: 2px;
  border-radius: 4px;
}

.btn {
  border: 1px solid var(--line);
  background: var(--ink-3);
  color: var(--paper);
  border-radius: var(--radius);
  padding: 13px var(--step-3);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.01em;
  transition: background 140ms ease, border-color 140ms ease, transform 100ms ease;
}
.btn:hover:not(:disabled) { background: var(--ink-4); border-color: var(--muted-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; }

.btn-primary {
  background: var(--marigold);
  border-color: var(--marigold);
  color: #1A1206;
  font-weight: 700;
}
.btn-primary:hover:not(:disabled) { background: #FFBE55; border-color: #FFBE55; }

.btn-mono {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.04em;
}

/* ---------- start screen ---------- */
.start {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: var(--step-3);
  text-align: center;
  padding: var(--step-5) 0;
}
.start-lede {
  max-width: 32ch;
  color: var(--paper);
  font-size: 18px;
  line-height: 1.45;
  margin: 0;
  text-wrap: balance;
}
.start-steps {
  display: flex;
  gap: var(--step-1);
  flex-wrap: wrap;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted-2);
  margin-top: 2px;
}
.start-steps span {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 9px;
}
.start-steps span:first-child { color: var(--marigold); border-color: var(--marigold-dim); }

/* ---------- guess rows ---------- */
.rows { display: flex; flex-direction: column; gap: var(--step-1); }

.row {
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: var(--step-2);
  padding: 7px var(--step-2) 7px 11px;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-left-color: var(--ink-4);
  border-radius: var(--radius);
  font-size: 14px;
  animation: rowIn 260ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
}
.row-empty {
  background: transparent;
  border-style: dashed;
  border-left-style: dashed;
  border-color: var(--ink-3);
  animation: none;
}
.row-wrong { border-left-color: var(--rose); }
.row-wrong .row-text {
  text-decoration: line-through;
  text-decoration-color: var(--muted-2);
  color: var(--muted);
}
.row-skip { border-left-color: var(--muted-2); }
.row-skip .row-text { color: var(--muted-2); font-style: italic; }
.row-correct {
  border-left-color: var(--jade);
  border-color: rgba(53,200,138,0.35);
  background: rgba(53,200,138,0.09);
}
.row-correct .row-text { color: var(--jade); font-weight: 600; }

.row-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* No uppercase transform here: it would render the duration as "0.5S" while
   the timeline ticks below say "0.5s". */
.row-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted-2);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

@keyframes rowIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: none; }
}

/* ---------- waveform + timeline ---------- */
.stage { display: flex; flex-direction: column; gap: var(--step-2); }

.wave {
  position: relative;
  display: flex;
  align-items: center;
  gap: 2px;
  height: 58px;
  padding: 0 2px;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.wave-bar {
  flex: 1;
  min-width: 0;
  border-radius: 1px;
  background: var(--ink-4);
  transition: background 120ms linear, opacity 120ms linear;
}
.wave-bar.is-unlocked { background: var(--marigold-dim); }
.wave-bar.is-hot { background: var(--marigold); }
.wave-seg {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.9;
  pointer-events: none;
}
.wave-head {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--paper);
  box-shadow: 0 0 10px rgba(244,241,234,0.6);
  pointer-events: none;
}

.ticks {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--muted-2);
  font-variant-numeric: tabular-nums;
}
.tick {
  text-align: center;
  padding: 3px 0;
  border-top: 2px solid var(--ink-3);
  transition: color 140ms ease, border-color 140ms ease;
}
.tick.is-on { color: var(--marigold); border-top-color: var(--marigold-dim); }
.tick.is-now { color: var(--paper); border-top-color: var(--marigold); }

/* ---------- transport ---------- */
.transport {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--step-3);
  padding: var(--step-1) 0;
}
.play {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  border: 2px solid var(--marigold);
  background: radial-gradient(circle at 50% 35%, rgba(242,169,59,0.22), rgba(242,169,59,0.06));
  color: var(--marigold);
  display: grid;
  place-items: center;
  transition: transform 140ms cubic-bezier(0.2,0.7,0.3,1), background 160ms ease, box-shadow 200ms ease;
  flex-shrink: 0;
}
.play:hover:not(:disabled) {
  transform: scale(1.05);
  background: radial-gradient(circle at 50% 35%, rgba(242,169,59,0.34), rgba(242,169,59,0.12));
  box-shadow: 0 0 0 8px rgba(242,169,59,0.06);
}
.play:active:not(:disabled) { transform: scale(0.97); }
.play:disabled { opacity: 0.35; border-color: var(--muted-2); color: var(--muted-2); background: none; }
.play svg { display: block; }
.play.is-idle { animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(242,169,59,0.16); }
  50%      { box-shadow: 0 0 0 12px rgba(242,169,59,0); }
}

.transport-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-width: 88px;
}
/* text-transform is reset here so the duration reads "0.5s", matching the
   timeline ticks, while the caption under it stays uppercase. */
.transport-meta b {
  display: block;
  color: var(--paper);
  font-size: 21px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
}

/* ---------- typeahead ---------- */
.guessbar { display: flex; flex-direction: column; gap: var(--step-2); position: relative; }

.combo { position: relative; }
.combo input {
  width: 100%;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--paper);
  font-family: inherit;
  font-size: 15px;
  padding: 14px var(--step-3);
  transition: border-color 140ms ease, background 140ms ease;
}
.combo input::placeholder { color: var(--muted-2); }
.combo input:focus {
  outline: none;
  border-color: var(--marigold);
  background: var(--ink-3);
}

.listbox {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  right: 0;
  max-height: 244px;
  overflow-y: auto;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 -14px 40px rgba(0,0,0,0.6);
  z-index: 20;
  padding: 4px;
  margin: 0;
  list-style: none;
}
.option {
  padding: 9px 11px;
  border-radius: 5px;
  cursor: pointer;
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 14px;
}
.option:hover, .option.is-active { background: var(--ink-4); }
.option.is-active { box-shadow: inset 2px 0 0 var(--marigold); }
.option-title { color: var(--paper); }
.option-movie {
  font-size: 11px;
  color: var(--muted-2);
  margin-left: auto;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45%;
}
.listbox-empty {
  padding: 11px;
  color: var(--muted-2);
  font-size: 13px;
  text-align: center;
}

.actions { display: flex; gap: var(--step-2); }
.actions .btn { flex: 1; }
.actions .btn-submit { flex: 1.4; }

/* Deliberately not a .btn: giving up should be reachable in one tap but never
   compete with Submit for the eye. */
.btn-giveup {
  display: block;
  width: 100%;
  margin-top: var(--step-2);
  padding: 10px;
  background: none;
  border: 0;
  color: var(--muted);
  font-family: var(--font-mono);
  font-size: 12px;
  letter-spacing: 0.04em;
  text-decoration: underline;
  text-underline-offset: 3px;
  transition: color 140ms ease;
}
.btn-giveup:hover:not(:disabled) { color: var(--paper); }
.btn-giveup:disabled { opacity: 0.4; }

/* ---------- reveal ---------- */
.reveal {
  display: flex;
  flex-direction: column;
  gap: var(--step-3);
  animation: revealIn 400ms cubic-bezier(0.2,0.7,0.3,1) both;
}
@keyframes revealIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.verdict {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.verdict.win  { color: var(--jade); }
.verdict.lose { color: var(--rose); }

.card {
  display: flex;
  gap: var(--step-3);
  align-items: center;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--step-3);
}
.cover {
  width: 104px;
  height: 104px;
  border-radius: 6px;
  flex-shrink: 0;
  object-fit: cover;
  background: var(--ink-4);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 30px;
  color: rgba(255,255,255,0.72);
  overflow: hidden;
}
.card-meta { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.card-title {
  font-family: var(--font-display);
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.card-artist { color: var(--paper); font-size: 14px; }
.card-movie {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--marigold);
}
/* Not a film title, so it should not be dressed as one. */
.card-movie.is-single { color: var(--muted); }

.fullplayer {
  display: flex;
  align-items: center;
  gap: var(--step-2);
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--step-2) var(--step-3);
}
.mini-play {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--marigold);
  background: rgba(242,169,59,0.12);
  color: var(--marigold);
  display: grid; place-items: center;
  flex-shrink: 0;
}
.mini-play:hover:not(:disabled) { background: rgba(242,169,59,0.24); }
.mini-play:disabled { opacity: 0.4; border-color: var(--muted-2); color: var(--muted-2); }
.scrub {
  flex: 1;
  height: 4px;
  background: var(--ink-4);
  border-radius: 999px;
  overflow: hidden;
}
.scrub-fill { height: 100%; background: var(--marigold); border-radius: 999px; }
.clock {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

/* ---------- notices ---------- */
.notice {
  border: 1px solid var(--line);
  border-left: 3px solid var(--marigold);
  background: var(--ink-2);
  border-radius: var(--radius);
  padding: var(--step-2) var(--step-3);
  font-size: 13px;
  color: var(--muted);
  line-height: 1.45;
}
.notice b { color: var(--paper); font-weight: 600; }
.notice code {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--marigold);
  background: var(--ink-3);
  border-radius: 4px;
  padding: 1px 5px;
  word-break: break-all;
}

.loading-label {

  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
}

.foot {
  margin-top: auto;
  padding-top: var(--step-3);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--muted-2);
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.foot a { color: var(--muted); }

      } else if (e.key === "ArrowUp") {
        e.preventDefault();
        setActive(function (a) { return Math.max(a - 1, 0); });
      } else if (e.key === "Enter") {
        e.preventDefault();
        if (open && matches[active]) choose(matches[active]);
        else if (choice) onSubmit(choice);
      } else if (e.key === "Escape") {
        setOpen(false);
      }
    }

    return h("div", { className: "guessbar" },
      h("div", { className: "combo", ref: wrapRef },
        open && !disabled ? h("ul", {
          className: "listbox",
          role: "listbox",
          "aria-label": "Song suggestions"
        },
          matches.length === 0
            ? h("li", { className: "listbox-empty" }, "No song in the list matches that")
            : matches.map(function (s, i) {
                return h("li", {
                  key: s.uid,
                  role: "option",
                  "aria-selected": i === active,
                  className: "option" + (i === active ? " is-active" : ""),
                  onMouseEnter: function () { setActive(i); },
                  onMouseDown: function (e) { e.preventDefault(); choose(s); }
                },
                  h("span", { className: "option-title" }, s.title),
                  h("span", { className: "option-movie" }, s.context));
              })
        ) : null,
        h("input", {
          type: "text",
          value: text,
          disabled: disabled,
          placeholder: "Type a song title…",
          autoComplete: "off",
          spellCheck: false,
          role: "combobox",
          "aria-expanded": open,
          "aria-autocomplete": "list",
          onChange: function (e) { setText(e.target.value); setOpen(true); },
          onFocus: function () { setOpen(true); },
          onKeyDown: onKeyDown
        })
      ),
      h("div", { className: "actions" },
        h("button", {
          className: "btn btn-mono",
          disabled: disabled,
          onClick: props.onSkip
        }, props.skipLabel),
        h("button", {
          className: "btn btn-primary btn-submit",
          disabled: disabled || !choice,
          onClick: function () { if (choice) onSubmit(choice); }
        }, "Submit guess")
      ),
      h("button", {
        className: "btn-giveup",
        disabled: disabled,
        onClick: props.onGiveUp
      }, "Give up and show me the song")
    );
  }

  /* ------------------------------------------------------------------ */
  /* Waveform                                                            */
  /* ------------------------------------------------------------------ */

  function Waveform(props) {
    var shape = props.shape, unlocked = props.unlocked, head = props.head;
    return h("div", { className: "wave" },
      shape.map(function (v, i) {
        var f = (i + 0.5) / WAVE_BARS;
        var cls = "wave-bar";
        if (f <= head) cls += " is-hot";
        else if (f <= unlocked) cls += " is-unlocked";
        return h("div", { key: i, className: cls, style: { height: (v * 100) + "%" } });
      }),
      [1, 2, 3, 4, 5].map(function (n) {
        return h("div", { key: "s" + n, className: "wave-seg", style: { left: ((n / 6) * 100) + "%" } });
      }),
      head > 0 ? h("div", { className: "wave-head", style: { left: (head * 100) + "%" } }) : null
    );
  }

  /* ------------------------------------------------------------------ */
  /* App                                                                 */
  /* ------------------------------------------------------------------ */

  // Built once, at load: the raw array from the top of the file with ids and
  // normalised forms attached. Everything below keys off uid, never title.
  var CATALOG = buildCatalog(window.BOLLYWOOD_SONGS, window.INCLUDE_NON_FILM !== false);
  var DUPE_TITLES = ambiguousTitles(CATALOG);

  // A guess row has to say WHICH song when the title alone is ambiguous,
  // otherwise a wrong answer reads as though it were the right one.
  function guessLabel(song) {
    return DUPE_TITLES[song.nTitle] ? song.title + " · " + song.context : song.title;
  }

  function App() {
    var SONGS = CATALOG;

    var [phase, setPhase] = useState("start");     // start | play | won | lost
    var [offline, setOffline] = useState(false);

    var [song, setSong] = useState(null);
    var [track, setTrack] = useState(null);        // the CURRENT round's preview
    var [ready, setReady] = useState(false);       // its audio is loaded and playable
    var [guesses, setGuesses] = useState([]);
    var [text, setText] = useState("");
    var [played, setPlayed] = useState([]);
    var [score, setScore] = useState({ won: 0, total: 0 });

    var [pos, setPos] = useState(0);
    var [busy, setBusy] = useState(false);
    var [audioErr, setAudioErr] = useState("");

    var audioRef = useRef(null);
    var playerRef = useRef(null);

    // Resolved previews, uid -> track, or null for a song with nothing usable
    // behind it. A ref, not state: the async round flow has to read it at the
    // moment it asks, and nothing renders off the whole map any more - the
    // reveal screen needs one track, and that one is held in state.
    var cacheRef = useRef({});
    var deadRef = useRef({});
    var prefetchRef = useRef(null);   // { uid, promise } for the song we expect next
    var offlineRef = useRef(false);   // readable from inside async closures
    var roundRef = useRef(0);         // stale-resolve guard: newest round wins

    /* ---- resolution ---- */

    function resolve(s) {
      return resolveOne(s).then(function (res) {
        if (res.offline) {
          // The request itself failed, so nothing is reachable. Demo mode is a
          // session-wide verdict; a song that merely has no preview is not.
          offlineRef.current = true;
          setOffline(true);
          return null;
        }
        cacheRef.current[s.uid] = res.track;
        if (!res.track) deadRef.current[s.uid] = true;
        return res.track;
      });
    }

    function trackFor(s) {
      if (offlineRef.current) return Promise.resolve(null);
      var cached = cacheRef.current[s.uid];
      if (cached !== undefined) return Promise.resolve(cached);
      var pre = prefetchRef.current;
      if (pre && pre.uid === s.uid) return pre.promise;
      return resolve(s);
    }

    // Resolve one song ahead while the player is busy guessing, so the next
    // round opens on audio that is already loaded.
    function prefetch(seen) {
      if (offlineRef.current) return;
      var fresh = SONGS.filter(function (s) {
        return !deadRef.current[s.uid] &&
               seen.indexOf(s.uid) === -1 &&
               cacheRef.current[s.uid] === undefined;
      });
      if (!fresh.length) { prefetchRef.current = null; return; }
      var pick = fresh[Math.floor(Math.random() * fresh.length)];
      prefetchRef.current = { uid: pick.uid, promise: resolve(pick) };
    }

    // One song, before the player has clicked anything. This is the only
    // request the page makes on its own, and it buys two things: the first
    // round opens instantly, and demo mode is known in time for the badge to
    // be on the start screen rather than appearing mid-round.
    useEffect(function () { prefetch([]); }, []);

    /* ---- the player follows the track, not the other way round ---- */

    // Chosen per load, never memoised across rounds: with lazy resolution the
    // first call happens before anything is known about the network, so a
    // player picked once and kept would lock the whole session into whichever
    // guess it made first.
    function playerFor(t) {
      var want = (t && t.previewUrl && audioRef.current) ? "audio" : "synth";
      if (!playerRef.current || playerRef.current.kind !== want) {
        if (playerRef.current) playerRef.current.stop();
        playerRef.current = want === "audio" ? makeAudioPlayer(audioRef.current) : makeSynthPlayer();
      }
      return playerRef.current;
    }

    function player() {
      if (!playerRef.current) playerRef.current = makeSynthPlayer();
      return playerRef.current;
    }

    var attempt = guesses.length;
    var limit = STEPS[Math.min(attempt, MAX_ATTEMPTS - 1)];
    var over = phase === "won" || phase === "lost";
    var unlocked = over ? 1 : (Math.min(attempt, MAX_ATTEMPTS - 1) + 1) / 6;

    var shape = useMemo(function () {
      return waveShape(song ? songSeed(song) : 1);
    }, [song]);

    /* ---- round control ---- */

    // The round is presented immediately and its audio arrives a moment later:
    // a click must never wait on the network. Until it lands the transport is
    // disabled, which is a state the player can see rather than a dead button.
    var startRound = useCallback(function (currentPlayed) {
      var token = ++roundRef.current;

      function deal(seen, triesLeft) {
        var alive = SONGS.filter(function (s) { return !deadRef.current[s.uid]; });
        var fresh = alive.filter(function (s) { return seen.indexOf(s.uid) === -1; });
        var from = fresh.length ? fresh : alive;
        if (!from.length) {
          setAudioErr("No song in the catalog has a playable preview right now.");
          return;
        }

        // Prefer the song already resolved in the background, when it is still
        // a legal pick - that is the whole point of having prefetched it.
        var pre = prefetchRef.current;
        var next = null;
        if (pre) {
          for (var i = 0; i < from.length; i++) if (from[i].uid === pre.uid) { next = from[i]; break; }
        }
        if (!next) next = from[Math.floor(Math.random() * from.length)];

        if (playerRef.current) playerRef.current.stop();
        setSong(next);
        setTrack(null);
        setReady(false);
        setGuesses([]);
        setText("");
        setPos(0);
        setAudioErr("");
        setPhase("play");
        setPlayed(fresh.length ? seen.concat([next.uid]) : [next.uid]);

        // The previous round may have been mid-playback - the reveal screen's
        // full preview keeps running until something stops it. Stopping the
        // player is not enough: busy has to come down with it, or the new round
        // opens showing a stop button for audio that is not playing.
        setBusy(false);

        trackFor(next).then(function (t) {
          if (token !== roundRef.current) return;    // a newer round superseded us
          // No preview and the network is fine means this one song is a dud:
          // drop it for the session and deal another rather than stranding the
          // player on a round they cannot hear.
          if (!t && !offlineRef.current) {
            deadRef.current[next.uid] = true;
            if (triesLeft > 0) return deal(seen, triesLeft - 1);
            setAudioErr("That preview would not load. Try skipping to the next song.");
            return;
          }
          setTrack(t);
          playerFor(t).load(t || { seed: songSeed(next) });
          setReady(true);
          prefetch(seen.concat([next.uid]));
        });
      }

      deal(currentPlayed || played, 2);
    }, [played]);

    function playSnippet(span) {
      var p = player();
      if (busy) { p.stop(); setBusy(false); setPos(0); return; }
      setAudioErr("");
      setBusy(true);
      p.play(span, {
        onTick: function (t) { setPos(t); },
        onEnd: function () { setBusy(false); setPos(0); }
      }).catch(function (err) {
        setBusy(false);
        setPos(0);
        // Autoplay policy is not a concern (every play is a click), but a dead
        // CDN or a dropped connection is.
        setAudioErr(err && err.name === "NotAllowedError"
          ? "Your browser blocked playback. Tap play once more."
          : "That preview would not load. Try skipping to the next song.");
      });
    }

    function finish(won, list) {
      setGuesses(list);
      setPhase(won ? "won" : "lost");
      setScore(function (s) { return { won: s.won + (won ? 1 : 0), total: s.total + 1 }; });
      player().stop();
      setBusy(false);
      setPos(0);
    }

    function submitGuess(picked) {
      if (over || !song) return;
      // Identity, not title. Hindi titles repeat across films (Tere Bina,
      // Zaalima, Bekhayali), and naming a different film's song of the same
      // name is a wrong answer, not a win.
      var right = picked.uid === song.uid;
      var list = guesses.concat([{ type: right ? "correct" : "wrong", title: guessLabel(picked) }]);
      setText("");
      if (right) return finish(true, list);
      if (list.length >= MAX_ATTEMPTS) return finish(false, list);
      setGuesses(list);
      player().stop();
      setBusy(false);
      setPos(0);
    }

    function skip() {
      if (over || !song) return;
      var list = guesses.concat([{ type: "skip" }]);
      setText("");
      if (list.length >= MAX_ATTEMPTS) return finish(false, list);
      setGuesses(list);
      player().stop();
      setBusy(false);
      setPos(0);
    }

    // Ends the round now. Skipping six times to reach a song you already know
    // you cannot name is a chore, not a decision. The rows are left as they
    // are rather than padded out to six, so the reveal shows what was actually
    // tried - which is also what tells the verdict line to say "gave up"
    // instead of "out of guesses".
    function giveUp() {
      if (over || !song) return;
      setText("");
      finish(false, guesses);
    }

    /* ---- derived UI values ---- */

    var headFrac = 0;
    if (busy && pos > 0) {
      headFrac = over
        ? Math.min(1, pos / (player().duration() || 30))
        : Math.min(unlocked, unlocked * (pos / limit));
    }

    var skipLabel = attempt >= MAX_ATTEMPTS - 1
      ? "Give up"
      : "Skip +" + label(STEPS[attempt + 1] - STEPS[attempt]);

    /* ---- screens ---- */

    function Masthead() {
      return h("header", { className: "masthead" },
        h("div", null,
          h("h1", { className: "wordmark" }, "Fil", h("em", null, "mi")),
          h("p", { className: "tagline" }, "Guess the Bollywood song")
        ),
        h("div", {
          style: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "7px" }
        },
          offline ? h("span", {
            className: "demochip",
            title: "Apple's previews are unreachable here, so the audio is synthesised"
          }, "Demo audio") : null,
          score.total > 0
            ? h("div", { className: "scoreline" },
                h("b", null, score.won), " / ", score.total, h("br"), "this session")
            : null
        )
      );
    }

    // The <audio> element is mounted once, above the phase switch. If it were
    // rendered inside each screen it would sit at a different position in each
    // tree and React would remount it on every phase change - which drops the
    // src and leaves the player holding a detached node.
    function frame(content) {
      return h(React.Fragment, null,
        h("audio", { ref: audioRef, preload: "auto" }),
        content);
    }

    function Foot() {
      return h("footer", { className: "foot" },
        h("div", null, "Audio previews and artwork supplied by the Apple iTunes Search API."),
        h("div", null, "Not affiliated with Apple. All songs belong to their respective rights holders.")
      );
    }

    if (phase === "start") {
      return frame(h("div", { className: "shell" },
        Masthead(),
        offline ? h("div", { className: "notice" },
          h("b", null, "No real songs here."), " Apple's preview servers are unreachable from this page, so every round runs on generated stand-in audio. The interface is fully playable, but the clips are not the actual recordings. ",
          h("b", null, "To hear the real Hindi songs,"), " open the ", h("code", null, "bollywood-heardle.html"),
          " file straight from your computer — same game, real 30-second previews."
        ) : null,
        audioErr ? h("div", { className: "notice bad" }, audioErr) : null,
        h("div", { className: "start" },
          h("p", { className: "start-lede" },
            "You get half a second of a Hindi film song. Name it. Every miss or skip buys you a little more."),
          h("div", { className: "start-steps" }, STEPS.map(function (s) {
            return h("span", { key: s }, label(s));
          })),
          h("button", {
            className: "btn btn-primary",
            style: { padding: "16px 34px", fontSize: "15px", marginTop: "8px" },
            onClick: function () { startRound([]); }
          }, "Endless / Random"),
          h("div", { className: "loading-label" }, SONGS.length + " songs in the catalog")
        ),
        Foot()
      ));
    }

    /* ---- reveal ---- */
    if (over) {
      return frame(h("div", { className: "shell" },
        Masthead(),
        h("div", { className: "reveal" },
          h("div", { className: "verdict " + (phase === "won" ? "win" : "lose") },
            phase === "won"
              ? "Correct in " + guesses.length + (guesses.length === 1 ? " guess" : " guesses")
              : guesses.length >= MAX_ATTEMPTS
                ? "Out of guesses — the song was"
                : "Gave up — the song was"),

          h("div", { className: "card" },
            track && track.artwork
              ? h("img", { className: "cover", src: track.artwork, alt: song.title + " cover art" })
              : h("div", {
                  className: "cover",
                  style: {
                    background: "linear-gradient(145deg, hsl(" + (songSeed(song) % 360) + " 42% 26%), var(--ink-4))"
                  }
                }, song.title.slice(0, 1).toUpperCase()),
            h("div", { className: "card-meta" },
              h("h2", { className: "card-title" }, song.title),
              h("div", { className: "card-artist" }, song.artist),
              // Non-film songs have no film line; the artist above already
              // says everything there is to say about where the song is from.
              song.isFilm
                ? h("div", { className: "card-movie" }, song.movie)
                : h("div", { className: "card-movie is-single" }, "Non-film single")
            )
          ),

          h("div", { className: "fullplayer" },
            h("button", {
              className: "mini-play",
              disabled: !ready,
              "aria-label": !ready ? "Loading the preview" : (busy ? "Stop" : "Play the full preview"),
              onClick: function () { playSnippet(null); }
            }, busy ? h(IconStop, { size: 17 }) : h(IconPlay, { size: 17 })),
            h("div", { className: "scrub" },
              h("div", {
                className: "scrub-fill",
                style: { width: (headFrac * 100) + "%" }
              })),
            h("div", { className: "clock" }, fmt(pos) + " / " + fmt(player().duration()))
          ),

          audioErr ? h("div", { className: "notice bad" }, audioErr) : null,

          offline ? h("div", { className: "notice" },
            h("b", null, "You heard stand-in audio, not the song."),
            " Apple's previews are unreachable from here, so the clip was generated."
          ) : null,

          // Directly under the player, above the guess history: moving on is
          // what almost everyone wants next, and it should never be something
          // you have to scroll past your own wrong answers to reach.
          h("button", {
            className: "btn btn-primary btn-next",
            onClick: function () { startRound(played); }
          }, "Next song"),

          h("div", { className: "rows" }, guesses.map(function (g, i) {
            return h("div", {
              key: i,
              className: "row row-" + g.type
            },
              h("span", { className: "row-text" }, g.type === "skip" ? "Skipped" : g.title),
              h("span", { className: "row-tag" }, label(STEPS[i]))
            );
          }))
        ),
        Foot()
      ));
    }

    /* ---- active round ---- */
    return frame(h("div", { className: "shell" },
      Masthead(),

      h("div", { className: "stage" },
        h(Waveform, { shape: shape, unlocked: unlocked, head: headFrac }),
        h("div", { className: "ticks" }, STEPS.map(function (s, i) {
          var on = i <= attempt;
          var now = i === attempt;
          return h("div", {
            key: s,
            className: "tick" + (on ? " is-on" : "") + (now ? " is-now" : "")
          }, label(s));
        }))
      ),

      h("div", { className: "transport" },
        h("div", { className: "transport-meta", style: { textAlign: "right" } },
          h("b", null, label(limit)), "unlocked"),
        h("button", {
          className: "play" + (!busy && ready ? " is-idle" : ""),
          disabled: !ready,
          "aria-label": !ready
            ? "Loading the preview"
            : (busy ? "Stop playback" : "Play " + label(limit) + " of the song"),
          onClick: function () { playSnippet(limit); }
        }, busy ? h(IconStop, null) : h(IconPlay, null)),
        h("div", { className: "transport-meta" },
          h("b", null, MAX_ATTEMPTS - attempt), "left")
      ),

      audioErr ? h("div", { className: "notice bad" }, audioErr) : null,

      h(Typeahead, {
        songs: SONGS,
        text: text,
        setText: setText,
        disabled: false,
        onSubmit: submitGuess,
        onSkip: skip,
        onGiveUp: giveUp,
        skipLabel: skipLabel
      }),

      // Below the controls, not above them. The waveform, the play button and
      // the guess box are what a round is actually played with; the history of
      // what you already got wrong is reference material, and putting it first
      // pushed the whole playable section down the screen on a phone.
      h("div", { className: "rows" },
        Array.apply(null, Array(MAX_ATTEMPTS)).map(function (_, i) {
          var g = guesses[i];
          if (!g) {
            return h("div", { key: i, className: "row row-empty" },
              h("span", { className: "row-text" }, ""),
              h("span", { className: "row-tag" }, label(STEPS[i])));
          }
          return h("div", { key: i, className: "row row-" + g.type },
            h("span", { className: "row-text" }, g.type === "skip" ? "Skipped" : g.title),
            h("span", { className: "row-tag" }, label(STEPS[i])));
        })
      ),

      Foot()
    ));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
