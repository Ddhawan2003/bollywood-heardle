<style>
/* Anton, inlined as a data URI. The Artifact CSP blocks font CDNs, so a
   linked webfont would silently fall back to a system face. */
@font-face {
  font-family: 'Anton';
  src: url(data:font/woff2;base64,__ANTON_B64__) format('woff2');
  font-weight: 400;
  font-style: normal;
  font-display: block;
}

/* This design commits to a single dark world on purpose - it is a darkened
   cinema hall, not a document. The tokens are pinned so the viewer's theme
   toggle cannot half-invert it into something broken. */
:root, :root[data-theme="dark"], :root[data-theme="light"] {
  --ink:      #0A0910;
  --ink-2:    #15121F;
  --ink-3:    #211D30;
  --ink-4:    #2C2740;
  --line:     #322C48;
  --marigold: #F2A93B;
  --marigold-dim: #7A5620;
  --rose:     #D8456F;
  --jade:     #35C88A;
  --muted:    #8E86A6;
  --muted-2:  #635C7A;
  --paper:    #F4F1EA;

  --step-1: 6px;
  --step-2: 10px;
  --step-3: 16px;
  --step-4: 24px;
  --step-5: 36px;

  --radius: 8px;
  --font-display: 'Anton', 'Haettenschweiler', 'Arial Narrow', sans-serif;
  --font-body: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --font-mono: ui-monospace, 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;

  color-scheme: dark;
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--ink);
  /* two very soft pools of warm light, like a projector bulb */
  /* Deliberately not background-attachment: fixed - it makes the compositor
     repaint the whole page behind the reveal animation and leaves ghost text. */
  background-image:
    radial-gradient(60rem 40rem at 50% -10%, rgba(242,169,59,0.10), transparent 60%),
    radial-gradient(45rem 35rem at 90% 105%, rgba(216,69,111,0.07), transparent 65%);
  background-repeat: no-repeat;
  color: var(--paper);
  font-family: var(--font-body);
  font-size: 16px;
  line-height: 1.5;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
}

#root { min-height: 100vh; }

.shell {
  width: 100%;
  max-width: 600px;
  margin: 0 auto;
  padding: var(--step-4) var(--step-3) var(--step-4);
  display: flex;
  flex-direction: column;
  gap: var(--step-3);
  min-height: 100vh;
}

/* ---------- masthead ---------- */
.masthead {
  display: flex;
  align-items: baseline;
  justify-content: space-between;
  gap: var(--step-3);
  border-bottom: 1px solid var(--line);
  padding-bottom: var(--step-2);
}
.wordmark {
  font-family: var(--font-display);
  font-size: clamp(30px, 8vw, 40px);
  letter-spacing: 0.02em;
  line-height: 0.9;
  margin: 0;
  color: var(--paper);
  text-transform: uppercase;
}
.wordmark em {
  font-style: normal;
  color: var(--marigold);
}
.tagline {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--muted-2);
  margin: 4px 0 0;
}
.scoreline {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  text-align: right;
  font-variant-numeric: tabular-nums;
  white-space: nowrap;
}
.scoreline b { color: var(--marigold); font-weight: 600; }

/* Demo-mode badge. This has to stay visible on every screen - if it only shows
   on the start screen, a player who clicks straight through has no idea the
   audio is synthesised rather than the real recording. */
.demochip {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--rose);
  border: 1px solid rgba(216,69,111,0.45);
  background: rgba(216,69,111,0.10);
  border-radius: 999px;
  padding: 3px 9px;
  white-space: nowrap;
}
.demochip::before {
  content: "";
  width: 5px; height: 5px;
  border-radius: 50%;
  background: var(--rose);
  flex-shrink: 0;
}

/* ---------- generic controls ---------- */
button { font-family: inherit; cursor: pointer; }
button:disabled { cursor: not-allowed; }

:where(button, input, a, [tabindex]):focus-visible {
  outline: 2px solid var(--marigold);
  outline-offset: 2px;
  border-radius: 4px;
}

.btn {
  border: 1px solid var(--line);
  background: var(--ink-3);
  color: var(--paper);
  border-radius: var(--radius);
  padding: 13px var(--step-3);
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.01em;
  transition: background 140ms ease, border-color 140ms ease, transform 100ms ease;
}
.btn:hover:not(:disabled) { background: var(--ink-4); border-color: var(--muted-2); }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn:disabled { opacity: 0.4; }

.btn-primary {
  background: var(--marigold);
  border-color: var(--marigold);
  color: #1A1206;
  font-weight: 700;
}
.btn-primary:hover:not(:disabled) { background: #FFBE55; border-color: #FFBE55; }

.btn-mono {
  font-family: var(--font-mono);
  font-size: 13px;
  letter-spacing: 0.04em;
}

/* ---------- start screen ---------- */
.start {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  gap: var(--step-3);
  text-align: center;
  padding: var(--step-5) 0;
}
.start-lede {
  max-width: 32ch;
  color: var(--paper);
  font-size: 18px;
  line-height: 1.45;
  margin: 0;
  text-wrap: balance;
}
.start-steps {
  display: flex;
  gap: var(--step-1);
  flex-wrap: wrap;
  justify-content: center;
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  color: var(--muted-2);
  margin-top: 2px;
}
.start-steps span {
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 3px 9px;
}
.start-steps span:first-child { color: var(--marigold); border-color: var(--marigold-dim); }

/* ---------- guess rows ---------- */
.rows { display: flex; flex-direction: column; gap: var(--step-1); }

.row {
  min-height: 40px;
  display: flex;
  align-items: center;
  gap: var(--step-2);
  padding: 7px var(--step-2) 7px 11px;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-left-width: 3px;
  border-left-color: var(--ink-4);
  border-radius: var(--radius);
  font-size: 14px;
  animation: rowIn 260ms cubic-bezier(0.2, 0.7, 0.3, 1) both;
}
.row-empty {
  background: transparent;
  border-style: dashed;
  border-left-style: dashed;
  border-color: var(--ink-3);
  animation: none;
}
.row-wrong { border-left-color: var(--rose); }
.row-wrong .row-text {
  text-decoration: line-through;
  text-decoration-color: var(--muted-2);
  color: var(--muted);
}
.row-skip { border-left-color: var(--muted-2); }
.row-skip .row-text { color: var(--muted-2); font-style: italic; }
.row-correct {
  border-left-color: var(--jade);
  border-color: rgba(53,200,138,0.35);
  background: rgba(53,200,138,0.09);
}
.row-correct .row-text { color: var(--jade); font-weight: 600; }

.row-text {
  flex: 1;
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
/* No uppercase transform here: it would render the duration as "0.5S" while
   the timeline ticks below say "0.5s". */
.row-tag {
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.1em;
  color: var(--muted-2);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

@keyframes rowIn {
  from { opacity: 0; transform: translateY(-6px); }
  to   { opacity: 1; transform: none; }
}

/* ---------- waveform + timeline ---------- */
.stage { display: flex; flex-direction: column; gap: var(--step-2); }

.wave {
  position: relative;
  display: flex;
  align-items: center;
  gap: 2px;
  height: 58px;
  padding: 0 2px;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  overflow: hidden;
}
.wave-bar {
  flex: 1;
  min-width: 0;
  border-radius: 1px;
  background: var(--ink-4);
  transition: background 120ms linear, opacity 120ms linear;
}
.wave-bar.is-unlocked { background: var(--marigold-dim); }
.wave-bar.is-hot { background: var(--marigold); }
.wave-seg {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 1px;
  background: var(--ink);
  opacity: 0.9;
  pointer-events: none;
}
.wave-head {
  position: absolute;
  top: 0;
  bottom: 0;
  width: 2px;
  background: var(--paper);
  box-shadow: 0 0 10px rgba(244,241,234,0.6);
  pointer-events: none;
}

.ticks {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 2px;
  font-family: var(--font-mono);
  font-size: 10px;
  letter-spacing: 0.06em;
  color: var(--muted-2);
  font-variant-numeric: tabular-nums;
}
.tick {
  text-align: center;
  padding: 3px 0;
  border-top: 2px solid var(--ink-3);
  transition: color 140ms ease, border-color 140ms ease;
}
.tick.is-on { color: var(--marigold); border-top-color: var(--marigold-dim); }
.tick.is-now { color: var(--paper); border-top-color: var(--marigold); }

/* ---------- transport ---------- */
.transport {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: var(--step-3);
  padding: var(--step-1) 0;
}
.play {
  width: 74px;
  height: 74px;
  border-radius: 50%;
  border: 2px solid var(--marigold);
  background: radial-gradient(circle at 50% 35%, rgba(242,169,59,0.22), rgba(242,169,59,0.06));
  color: var(--marigold);
  display: grid;
  place-items: center;
  transition: transform 140ms cubic-bezier(0.2,0.7,0.3,1), background 160ms ease, box-shadow 200ms ease;
  flex-shrink: 0;
}
.play:hover:not(:disabled) {
  transform: scale(1.05);
  background: radial-gradient(circle at 50% 35%, rgba(242,169,59,0.34), rgba(242,169,59,0.12));
  box-shadow: 0 0 0 8px rgba(242,169,59,0.06);
}
.play:active:not(:disabled) { transform: scale(0.97); }
.play:disabled { opacity: 0.35; border-color: var(--muted-2); color: var(--muted-2); background: none; }
.play svg { display: block; }
.play.is-idle { animation: breathe 3.4s ease-in-out infinite; }
@keyframes breathe {
  0%, 100% { box-shadow: 0 0 0 0 rgba(242,169,59,0.16); }
  50%      { box-shadow: 0 0 0 12px rgba(242,169,59,0); }
}

.transport-meta {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  min-width: 88px;
}
/* text-transform is reset here so the duration reads "0.5s", matching the
   timeline ticks, while the caption under it stays uppercase. */
.transport-meta b {
  display: block;
  color: var(--paper);
  font-size: 21px;
  font-weight: 400;
  letter-spacing: 0;
  text-transform: none;
}

/* ---------- typeahead ---------- */
.guessbar { display: flex; flex-direction: column; gap: var(--step-2); position: relative; }

.combo { position: relative; }
.combo input {
  width: 100%;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  color: var(--paper);
  font-family: inherit;
  font-size: 15px;
  padding: 14px var(--step-3);
  transition: border-color 140ms ease, background 140ms ease;
}
.combo input::placeholder { color: var(--muted-2); }
.combo input:focus {
  outline: none;
  border-color: var(--marigold);
  background: var(--ink-3);
}

.listbox {
  position: absolute;
  bottom: calc(100% + 6px);
  left: 0;
  right: 0;
  max-height: 244px;
  overflow-y: auto;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  box-shadow: 0 -14px 40px rgba(0,0,0,0.6);
  z-index: 20;
  padding: 4px;
  margin: 0;
  list-style: none;
}
.option {
  padding: 9px 11px;
  border-radius: 5px;
  cursor: pointer;
  display: flex;
  align-items: baseline;
  gap: 8px;
  font-size: 14px;
}
.option:hover, .option.is-active { background: var(--ink-4); }
.option.is-active { box-shadow: inset 2px 0 0 var(--marigold); }
.option-title { color: var(--paper); }
.option-movie {
  font-size: 11px;
  color: var(--muted-2);
  margin-left: auto;
  font-family: var(--font-mono);
  letter-spacing: 0.04em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 45%;
}
.listbox-empty {
  padding: 11px;
  color: var(--muted-2);
  font-size: 13px;
  text-align: center;
}

.actions { display: flex; gap: var(--step-2); }
.actions .btn { flex: 1; }
.actions .btn-submit { flex: 1.4; }

/* ---------- reveal ---------- */
.reveal {
  display: flex;
  flex-direction: column;
  gap: var(--step-3);
  animation: revealIn 400ms cubic-bezier(0.2,0.7,0.3,1) both;
}
@keyframes revealIn {
  from { opacity: 0; transform: translateY(10px); }
  to   { opacity: 1; transform: none; }
}

.verdict {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.2em;
  text-transform: uppercase;
}
.verdict.win  { color: var(--jade); }
.verdict.lose { color: var(--rose); }

.card {
  display: flex;
  gap: var(--step-3);
  align-items: center;
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--step-3);
}
.cover {
  width: 104px;
  height: 104px;
  border-radius: 6px;
  flex-shrink: 0;
  object-fit: cover;
  background: var(--ink-4);
  display: grid;
  place-items: center;
  font-family: var(--font-display);
  font-size: 30px;
  color: rgba(255,255,255,0.72);
  overflow: hidden;
}
.card-meta { min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.card-title {
  font-family: var(--font-display);
  font-size: clamp(24px, 6vw, 32px);
  line-height: 1;
  margin: 0;
  text-transform: uppercase;
  letter-spacing: 0.01em;
  text-wrap: balance;
}
.card-artist { color: var(--paper); font-size: 14px; }
.card-movie {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--marigold);
}

.fullplayer {
  display: flex;
  align-items: center;
  gap: var(--step-2);
  background: var(--ink-2);
  border: 1px solid var(--line);
  border-radius: var(--radius);
  padding: var(--step-2) var(--step-3);
}
.mini-play {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: 1px solid var(--marigold);
  background: rgba(242,169,59,0.12);
  color: var(--marigold);
  display: grid; place-items: center;
  flex-shrink: 0;
}
.mini-play:hover { background: rgba(242,169,59,0.24); }
.scrub {
  flex: 1;
  height: 4px;
  background: var(--ink-4);
  border-radius: 999px;
  overflow: hidden;
}
.scrub-fill { height: 100%; background: var(--marigold); border-radius: 999px; }
.clock {
  font-family: var(--font-mono);
  font-size: 11px;
  color: var(--muted);
  font-variant-numeric: tabular-nums;
  flex-shrink: 0;
}

.applelink {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 9px;
  text-decoration: none;
  background: var(--paper);
  color: #14121F;
  border-radius: var(--radius);
  padding: 13px var(--step-3);
  font-size: 14px;
  font-weight: 600;
  transition: background 140ms ease;
}
.applelink:hover { background: #fff; }
.applelink svg { flex-shrink: 0; }

/* ---------- notices ---------- */
.notice {
  border: 1px solid var(--line);
  border-left: 3px solid var(--marigold);
  background: var(--ink-2);
  border-radius: var(--radius);
  padding: var(--step-2) var(--step-3);
  font-size: 13px;
  color: var(--muted);
  line-height: 1.45;
}
.notice b { color: var(--paper); font-weight: 600; }
.notice code {
  font-family: var(--font-mono);
  font-size: 12px;
  color: var(--marigold);
  background: var(--ink-3);
  border-radius: 4px;
  padding: 1px 5px;
  word-break: break-all;
}
.notice.bad { border-left-color: var(--rose); }

.loading {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: var(--step-3);
  text-align: center;
}
.meter {
  width: 190px;
  height: 3px;
  background: var(--ink-3);
  border-radius: 999px;
  overflow: hidden;
}
.meter-fill {
  height: 100%;
  background: var(--marigold);
  transition: width 260ms ease;
}
.loading-label {
  font-family: var(--font-mono);
  font-size: 11px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted-2);
}

.foot {
  margin-top: auto;
  padding-top: var(--step-3);
  border-top: 1px solid var(--line);
  font-size: 11px;
  color: var(--muted-2);
  line-height: 1.6;
  display: flex;
  flex-direction: column;
  gap: 2px;
}
.foot a { color: var(--muted); }

@media (max-width: 420px) {
  .card { flex-direction: column; align-items: flex-start; text-align: left; }
  .cover { width: 100%; height: 150px; }
  .transport { gap: var(--step-2); }
  .transport-meta { min-width: 72px; }

      if (list.length >= MAX_ATTEMPTS) return finish(false, list);
      setGuesses(list);
      player().stop();
      setBusy(false);
      setPos(0);
    }

    function skip() {
      if (over || !song) return;
      var list = guesses.concat([{ type: "skip" }]);
      setText("");
      if (list.length >= MAX_ATTEMPTS) return finish(false, list);
      setGuesses(list);
      player().stop();
      setBusy(false);
      setPos(0);
    }

    /* ---- derived UI values ---- */

    var headFrac = 0;
    if (busy && pos > 0) {
      headFrac = over
        ? Math.min(1, pos / (player().duration() || 30))
        : Math.min(unlocked, unlocked * (pos / limit));
    }

    var skipLabel = attempt >= MAX_ATTEMPTS - 1
      ? "Give up"
      : "Skip +" + label(STEPS[attempt + 1] - STEPS[attempt]);

    /* ---- screens ---- */

    function Masthead() {
      return h("header", { className: "masthead" },
        h("div", null,
          h("h1", { className: "wordmark" }, "Fil", h("em", null, "mi")),
          h("p", { className: "tagline" }, "Guess the Bollywood song")
        ),
        h("div", {
          style: { display: "flex", flexDirection: "column", alignItems: "flex-end", gap: "7px" }
        },
          offline ? h("span", {
            className: "demochip",
            title: "Apple's previews are unreachable here, so the audio is synthesised"
          }, "Demo audio") : null,
          score.total > 0
            ? h("div", { className: "scoreline" },
                h("b", null, score.won), " / ", score.total, h("br"), "this session")
            : null
        )
      );
    }

    // The <audio> element is mounted once, above the phase switch. If it were
    // rendered inside each screen it would sit at a different position in each
    // tree and React would remount it on every phase change - which drops the
    // src and leaves the player holding a detached node.
    function frame(content) {
      return h(React.Fragment, null,
        h("audio", { ref: audioRef, preload: "auto" }),
        content);
    }

    function Foot() {
      return h("footer", { className: "foot" },
        h("div", null, "Audio previews and artwork supplied by the Apple iTunes Search API."),
        h("div", null, "Not affiliated with Apple. All songs belong to their respective rights holders.")
      );
    }

    if (phase === "loading") {
      var pct = progress.total ? Math.round((progress.done / progress.total) * 100) : 0;
      return frame(h("div", { className: "shell" },
        Masthead(),
        h("div", { className: "loading" },
          h("div", { className: "loading-label" }, "Resolving previews"),
          h("div", { className: "meter" }, h("div", { className: "meter-fill", style: { width: pct + "%" } })),
          h("div", { className: "loading-label" }, progress.done + " / " + progress.total)
        ),
        Foot()
      ));
    }

    if (phase === "start") {
      return frame(h("div", { className: "shell" },
        Masthead(),
        offline ? h("div", { className: "notice" },
          h("b", null, "No real songs here."), " Apple's preview servers are unreachable from this page, so every round runs on generated stand-in audio. The interface is fully playable, but the clips are not the actual recordings. ",
          h("b", null, "To hear the real Hindi songs,"), " open the ", h("code", null, "bollywood-heardle.html"),
          " file straight from your computer — same game, real 30-second previews."
        ) : null,
        h("div", { className: "start" },
          h("p", { className: "start-lede" },
            "You get half a second of a Hindi film song. Name it. Every miss or skip buys you a little more."),
          h("div", { className: "start-steps" }, STEPS.map(function (s) {
            return h("span", { key: s }, label(s));
          })),
          h("button", {
            className: "btn btn-primary",
            style: { padding: "16px 34px", fontSize: "15px", marginTop: "8px" },
            onClick: function () { startRound([]); }
          }, "Endless / Random"),
          h("div", { className: "loading-label" }, pool.length + " songs in the catalog")
        ),
        Foot()
      ));
    }

    /* ---- reveal ---- */
    if (over) {
      var appleUrl = (track && track.trackViewUrl)
        || (song.trackId ? "https://music.apple.com/in/song/" + song.trackId : null);

      return frame(h("div", { className: "shell" },
        Masthead(),
        h("div", { className: "reveal" },
          h("div", { className: "verdict " + (phase === "won" ? "win" : "lose") },
            phase === "won"
              ? "Correct in " + guesses.length + (guesses.length === 1 ? " guess" : " guesses")
              : "Out of guesses — the song was"),

          h("div", { className: "card" },
            track && track.artwork
              ? h("img", { className: "cover", src: track.artwork, alt: song.title + " cover art" })
              : h("div", {
                  className: "cover",
                  style: {
                    background: "linear-gradient(145deg, hsl(" + (seedFrom(song.title) % 360) + " 42% 26%), var(--ink-4))"
                  }
                }, song.title.slice(0, 1).toUpperCase()),
            h("div", { className: "card-meta" },
              h("h2", { className: "card-title" }, song.title),
              h("div", { className: "card-artist" }, song.artist),
              h("div", { className: "card-movie" }, song.movie)
            )
          ),

          h("div", { className: "fullplayer" },
            h("button", {
              className: "mini-play",
              "aria-label": busy ? "Stop" : "Play the full preview",
              onClick: function () { playSnippet(null); }
            }, busy ? h(IconStop, { size: 17 }) : h(IconPlay, { size: 17 })),
            h("div", { className: "scrub" },
              h("div", {
                className: "scrub-fill",
                style: { width: (headFrac * 100) + "%" }
              })),
            h("div", { className: "clock" }, fmt(pos) + " / " + fmt(player().duration()))
          ),

          audioErr ? h("div", { className: "notice bad" }, audioErr) : null,

          offline ? h("div", { className: "notice" },
            h("b", null, "You heard stand-in audio, not the song."),
            " Apple's previews are unreachable from here, so the clip was generated. The link below plays the real recording."
          ) : null,

          // Apple requires the track link to be shown wherever their previews
          // are used, so this is never conditional on the round's outcome.
          appleUrl ? h("a", {
            className: "applelink",
            href: appleUrl,
            target: "_blank",
            rel: "noopener noreferrer"
          }, h(IconApple), "Listen on Apple Music") : null,

          h("div", { className: "rows" }, guesses.map(function (g, i) {
            return h("div", {
              key: i,
              className: "row row-" + g.type
            },
              h("span", { className: "row-text" }, g.type === "skip" ? "Skipped" : g.title),
              h("span", { className: "row-tag" }, label(STEPS[i]))
            );
          })),

          h("button", {
            className: "btn btn-primary",
            onClick: function () { startRound(played); }
          }, "Next song")
        ),
        Foot()
      ));
    }

    /* ---- active round ---- */
    return frame(h("div", { className: "shell" },
      Masthead(),

      h("div", { className: "rows" },
        Array.apply(null, Array(MAX_ATTEMPTS)).map(function (_, i) {
          var g = guesses[i];
          if (!g) {
            return h("div", { key: i, className: "row row-empty" },
              h("span", { className: "row-text" }, ""),
              h("span", { className: "row-tag" }, label(STEPS[i])));
          }
          return h("div", { key: i, className: "row row-" + g.type },
            h("span", { className: "row-text" }, g.type === "skip" ? "Skipped" : g.title),
            h("span", { className: "row-tag" }, label(STEPS[i])));
        })
      ),

      h("div", { className: "stage" },
        h(Waveform, { shape: shape, unlocked: unlocked, head: headFrac }),
        h("div", { className: "ticks" }, STEPS.map(function (s, i) {
          var on = i <= attempt;
          var now = i === attempt;
          return h("div", {
            key: s,
            className: "tick" + (on ? " is-on" : "") + (now ? " is-now" : "")
          }, label(s));
        }))
      ),

      h("div", { className: "transport" },
        h("div", { className: "transport-meta", style: { textAlign: "right" } },
          h("b", null, label(limit)), "unlocked"),
        h("button", {
          className: "play" + (!busy ? " is-idle" : ""),
          "aria-label": busy ? "Stop playback" : "Play " + label(limit) + " of the song",
          onClick: function () { playSnippet(limit); }
        }, busy ? h(IconStop, null) : h(IconPlay, null)),
        h("div", { className: "transport-meta" },
          h("b", null, MAX_ATTEMPTS - attempt), "left")
      ),

      audioErr ? h("div", { className: "notice bad" }, audioErr) : null,

      h(Typeahead, {
        songs: SONGS,
        text: text,
        setText: setText,
        disabled: false,
        onSubmit: submitGuess,
        onSkip: skip,
        skipLabel: skipLabel
      }),

      Foot()
    ));
  }

  ReactDOM.createRoot(document.getElementById("root")).render(h(App));
})();
</script>
